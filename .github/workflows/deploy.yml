name: Deploy .NET 8 API to EC2

on:
  push:
    tags:
      - 'v*'  # Deploy only when a version tag is pushed (e.g., v1.0.0)

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Extract version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - name: Build and push Docker image
        run: |
          docker build -t sithuramyo/cicd:$VERSION -f github-action/Dockerfile .
          docker push sithuramyo/cicd:$VERSION
          docker tag sithuramyo/cicd:$VERSION sithuramyo/cicd:latest
          docker push sithuramyo/cicd:latest

      # ✅ Step to manually set up SSH key for secure login
      - name: Set Up SSH Key
        run: |
          echo "${{ secrets.EC2_SSH_KEY }}" > ci-cd.pem
          chmod 600 ci-cd.pem
          ls -lah  # Check if the file exists (for debugging)


      # ✅ Deploy using SSH
      - name: Deploy to EC2
        run: |
          ssh -o StrictHostKeyChecking=no -i ci-cd.pem ubuntu@${{ secrets.EC2_HOST }} << 'EOF'
            echo "Pulling the latest version of the API..."
            docker pull sithuramyo/cicd:$VERSION

            echo "Stopping and removing old container (if running)..."
            docker stop my-api-container || true
            docker rm my-api-container || true

            echo "Starting new API container..."
            docker run -d --name ci-cd-container -p 80:80 sithuramyo/cicd:$VERSION

            echo "Deployment completed successfully!"
          EOF
