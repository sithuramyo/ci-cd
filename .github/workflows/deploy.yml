name: Deploy .NET 8 API to EC2

on:
  push:
    tags:
      - 'v*'  # Deploy only when a version tag is pushed (e.g., v1.0.0)

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Extract version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - name: Debug Version
        run: echo "Deploying version:$VERSION"

      - name: Build and push Docker image
        run: |
          docker build -t sithuramyo/cicd:$VERSION -f github-action/Dockerfile .
          docker push sithuramyo/cicd:$VERSION
          docker tag sithuramyo/cicd:$VERSION sithuramyo/cicd:latest
          docker push sithuramyo/cicd:latest

      # ✅ Set up SSH key for secure login
      - name: Set Up SSH Key
        run: |
          echo "${{ secrets.EC2_SSH_KEY }}" | tr -d '\r' > private_key.pem
          chmod 600 private_key.pem
          ls -lah  # Debug: Check if the key file exists
          cat private_key.pem | head -n 5  # Debug: Print first 5 lines

      # ✅ Deploy to EC2 using SSH
      - name: Deploy to EC2
        env:
          VERSION: ${{ github.ref_name }}  # Pass the version as an environment variable
        run: |
          ssh -o StrictHostKeyChecking=no -i private_key.pem ec2-user@${{ secrets.EC2_HOST }} << EOF
            echo "Extracting version from Docker Hub..."
            echo "Deploying version: $VERSION"

            echo "Pulling the latest version of the API..."
            docker pull sithuramyo/cicd:$VERSION

            echo "Stopping and removing old container (if running)..."
            docker stop ci-cd-container || true
            docker rm ci-cd-container || true

            echo "Starting new API container..."
            docker run -d --name ci-cd-container -p 80:80 sithuramyo/cicd:$VERSION

            echo "Deployment completed successfully!"
          EOF
